# The account the shared Browser runs as (ADR-036): no rights, no password,
# no shell. Its home is the browser's profile. __BRAND_NAME__ Desktop's server joins
# its group to open the VNC socket, and nobody else does.
u __BRAND__-browser - "__BRAND_NAME__ Browser" /var/lib/__BRAND__-browser /usr/sbin/nologin
m __BRAND__-desktop __BRAND__-browser
