<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- __BRAND_NAME__ Desktop helper (ADR-023): only root owns the name, and only the
     desktop's user may call it. -->
<busconfig>
  <policy user="root">
    <allow own="io.kura.Helper"/>
  </policy>
  <policy user="__BRAND__-desktop">
    <allow send_destination="io.kura.Helper" send_interface="io.kura.Helper1"/>
  </policy>
  <policy context="default">
    <deny send_destination="io.kura.Helper"/>
  </policy>
</busconfig>
