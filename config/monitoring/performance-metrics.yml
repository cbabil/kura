metrics:
  collection:
    interval: 15
    retention_days: 30
    
  thresholds:
    cpu:
      warning: 80
      critical: 90
      sustained_period: 300
      
    memory:
      warning: 85
      critical: 95
      sustained_period: 300
      
    disk:
      warning: 80
      critical: 90
      
    network:
      bandwidth_warning: 80
      latency_warning: 100
      packet_loss_warning: 1

alerts:
  channels:
    - type: prometheus
      endpoint: http://prometheus:9090
    - type: webhook
      url: https://alerts.stratura.io/v1/notifications
    - type: log
      path: /var/log/stratura/performance.log 