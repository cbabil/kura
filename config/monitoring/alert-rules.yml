groups:
  - name: stratura-alerts
    rules:
      - alert: HighCPUUsage
        expr: system_cpu_usage > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage detected
          
      - alert: HighMemoryUsage
        expr: system_memory_usage > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage detected
          
      - alert: DiskSpaceLow
        expr: system_disk_usage > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Low disk space detected
          
      - alert: ContainerDown
        expr: container_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Container is down 