global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'stratura-node'
    static_configs:
      - targets: ['localhost:9100']
    
  - job_name: 'stratura-containers'
    static_configs:
      - targets: ['localhost:9323']

  - job_name: 'stratura-supervisor'
    static_configs:
      - targets: ['localhost:48484']

alerting:
  alertmanagers:
    - static_configs:
      - targets: ['localhost:9093'] 