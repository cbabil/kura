global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend stratura_api
    bind *:48484 ssl crt /etc/stratura/certs/api.pem
    mode http
    option forwardfor
    default_backend api_servers

backend api_servers
    mode http
    balance roundrobin
    option httpchk GET /health
    server api1 127.0.0.1:8001 check
    server api2 127.0.0.1:8002 check backup

frontend stratura_metrics
    bind *:9090
    mode http
    default_backend metrics_servers

backend metrics_servers
    mode http
    balance roundrobin
    option httpchk GET /health
    server metrics1 127.0.0.1:9091 check
    server metrics2 127.0.0.1:9092 check backup 