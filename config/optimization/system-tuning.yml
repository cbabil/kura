# System-wide performance tuning
system:
  cpu:
    governor: ondemand
    min_freq: 600000
    max_freq: 1800000
    boost: true
    
  memory:
    swappiness: 10
    vfs_cache_pressure: 50
    dirty_ratio: 10
    dirty_background_ratio: 5
    
  io:
    scheduler: deadline
    read_ahead_kb: 2048
    max_sectors_kb: 512
    
  network:
    tcp_congestion: cubic
    tcp_fastopen: 3
    rmem_max: 16777216
    wmem_max: 16777216

# Container optimization
containers:
  default_shm_size: 64M
  storage_driver: overlay2
  max_concurrent_downloads: 3
  max_concurrent_uploads: 5
  
# Resource limits
resources:
  max_containers: 50
  reserved_memory: 512M
  reserved_cpu: 10 