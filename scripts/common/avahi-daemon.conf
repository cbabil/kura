# Kura: the device answers to <host>.local on the local network (ADR-030).
# It publishes its name, its IPv4 addresses and the services in
# /etc/avahi/services; nothing about its hardware or its other programs.
# Read through a drop-in of avahi-daemon.service; Debian's own
# /etc/avahi/avahi-daemon.conf is not used.
[server]
use-ipv4=yes
# The firewall lets no ICMPv6 in: a name with an IPv6 address would send
# browsers to an address that does not answer
use-ipv6=no
# Containers' own networks are not the home network (the firewall refuses
# the other Docker bridges)
deny-interfaces=docker0
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-fsize=0
rlimit-nofile=768
rlimit-nproc=3
