set timeout=5
set default=0

insmod all_video
insmod iso9660
insmod gfxterm

set gfxmode=auto
terminal_output gfxterm

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

echo ""
echo "  ____  _              _                    ___  ____  "
echo " / ___|| |_ _ __ __ _| |_ _   _ _ __ __ _ / _ \\/ ___| "
echo " \\___ \\| __| '__/ _\` | __| | | | '__/ _\` | | | \\___ \\ "
echo "  ___) | |_| | | (_| | |_| |_| | | | (_| | |_| |___) |"
echo " |____/ \\__|_|  \\__,_|\\__|\\__,_|_|  \\__,_|\\___/|____/ "
echo ""

menuentry "StraturaOS" {
    linux /boot/vmlinuz boot=live toram console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "StraturaOS (Serial Console)" {
    linux /boot/vmlinuz boot=live toram console=ttyS0,115200
    initrd /boot/initrd.img
}
