set timeout=5
set default=0

insmod all_video
insmod iso9660
insmod gfxterm

set gfxmode=auto
terminal_output gfxterm

set color_normal=white/blue
set menu_color_normal=white/blue
set menu_color_highlight=black/white

menuentry "Kura" {
    linux /boot/vmlinuz boot=live toram quiet loglevel=1 console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "Kura (Debug)" {
    linux /boot/vmlinuz boot=live toram loglevel=7 console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "Kura (Serial Console)" {
    linux /boot/vmlinuz boot=live toram quiet loglevel=1 console=ttyS0,115200
    initrd /boot/initrd.img
}
