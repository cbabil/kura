set timeout=5
set default=0

insmod all_video
insmod iso9660
insmod gfxterm

set gfxmode=auto
terminal_output gfxterm

set color_normal=white/blue
set menu_color_normal=white/blue
set menu_color_highlight=black/white

menuentry "FalkenOS" {
    linux /boot/vmlinuz boot=live toram loglevel=3 console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "FalkenOS (Serial Console)" {
    linux /boot/vmlinuz boot=live toram loglevel=3 console=ttyS0,115200
    initrd /boot/initrd.img
}
