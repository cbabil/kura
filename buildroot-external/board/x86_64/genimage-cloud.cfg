# Cloud Disk Image Configuration

image efi.vfat {
    vfat {
        files = {
            "EFI/BOOT/bootx64.efi",
            "EFI/BOOT/grub.cfg"
        }
    }
    size = 64M
}

image disk.img {
    hdimage {
        gpt = true
    }

    partition efi {
        partition-type-uuid = C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        bootable = true
        image = "efi.vfat"
    }

    partition root {
        partition-type-uuid = 4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709
        image = "rootfs.ext4"
        size = 4G
    }
}
