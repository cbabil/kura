# StraturaOS SD Card Image Configuration

image boot.vfat {
    vfat {
        files = {
            "bcm2712-rpi-5-b.dtb",
            "Image",
            "config.txt",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/fixup4.dat",
            "rpi-firmware/start4.elf",
            "rpi-firmware/overlays"
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 2G
    }
}
