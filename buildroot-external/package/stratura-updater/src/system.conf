[system]
compatible=straturaOS-rpi5
bootloader=uboot
mountprefix=/mnt/rauc

[keyring]
path=/etc/rauc/ca.cert.pem

[handlers]
pre-install=/usr/lib/rauc/pre-install.sh
post-install=/usr/lib/rauc/post-install.sh

[slot.boot.0]
device=/dev/mmcblk0p1
type=vfat
bootname=boot

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=system-a

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=system-b

[slot.state]
device=/dev/mmcblk0p5
type=ext4
bootname=state

[slot.data]
device=/dev/mmcblk0p6
type=ext4
bootname=data 