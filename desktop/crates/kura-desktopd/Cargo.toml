[package]
name = "kura-desktopd"
description = "Kura Desktop's server: HTTPS, sign-in, stats over WebSocket and the embedded interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# A fake password check (any user, password "kura") and plain HTTP, for
# development on a Mac. Never in release builds for the image.
dev-auth = []

[dependencies]
kura-desktop-core.workspace = true
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
kura-helper = { path = "../kura-helper" }
zbus = { workspace = true, features = ["p2p"] }
tempfile.workspace = true
kura-desktop-core = { workspace = true, features = ["fixtures"] }
tower.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
