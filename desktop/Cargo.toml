[workspace]
resolver = "3"
members = ["crates/kura-desktop-core", "crates/kura-desktopd", "crates/kura-helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
kura-desktop-core = { path = "crates/kura-desktop-core" }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
getrandom = "0.3"
procfs-core = { version = "0.18", default-features = false }
rustix = { version = "1", features = ["fs"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
zeroize = { version = "1", features = ["serde", "std"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
