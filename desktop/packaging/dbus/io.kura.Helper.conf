<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- kura-helper (root) owns io.kura.Helper; only kura-desktopd's user may
     call it, and only its Authenticate method (ADR-023). -->
<busconfig>
  <policy user="root">
    <allow own="io.kura.Helper"/>
  </policy>
  <policy user="kura-desktop">
    <allow send_destination="io.kura.Helper" send_interface="io.kura.Helper" send_member="Authenticate"/>
  </policy>
  <policy context="default">
    <deny send_destination="io.kura.Helper"/>
  </policy>
</busconfig>
