MACHINE = "raspberrypi5"
DISTRO = "straturaOS"
PACKAGE_CLASSES ?= "package_ipk"

# Enable required features
DISTRO_FEATURES_append = " systemd virtualization bluetooth wifi"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
VIRTUAL-RUNTIME_initscripts = ""

# Enable features for OTA and containers
DISTRO_FEATURES_append = " rauc docker"

# Add Docker packages
IMAGE_INSTALL_append = " \
    docker-ce \
    docker-compose \
    python3-docker-compose \
    networkmanager \
    networkmanager-nmcli \
    stratura-supervisor \
    stratura-config \
    openssh-server-sshd \
    wireless-tools \
    wpa-supplicant \
    bluez5 \
    kernel-modules \
    stratura-resinhup \
"

# Custom splash screen
IMAGE_INSTALL_append = " psplash"
SPLASH = "psplash-stratura"

# Enable GPU support for RPi5
GPU_MEM = "256"
ENABLE_DRM = "1"

# System configs
CORE_IMAGE_EXTRA_INSTALL += " \
    packagegroup-core-boot \
    packagegroup-core-ssh-openssh \
"

# Development tools
EXTRA_IMAGE_FEATURES += "debug-tweaks"

# Partition Configuration
STRATURA_BOOTLOADER_PARTITION_SIZE = "40960"
STRATURA_STATE_PARTITION_SIZE = "20480"
STRATURA_DATA_PARTITION_SIZE = "204800"