test_environments:
  - name: qemu
    type: virtual
    arch: arm64
    memory: 2048
    cores: 2
  - name: raspberry-pi-5
    type: hardware
    arch: arm64
    model: rpi5

test_suites:
  unit:
    timeout: 300
    parallel: true
    coverage: true
  integration:
    timeout: 600
    parallel: false
    requires_hardware: false
  system:
    timeout: 1200
    parallel: false
    requires_hardware: true
  security:
    timeout: 900
    parallel: false
    requires_hardware: true 