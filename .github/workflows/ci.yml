name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning \
                     packages/os-security/src/os-security \
                     packages/os-security/src/lib/*.sh \
                     packages/os-config/src/os-config \
                     scripts/common/*.sh \
                     scripts/rpi5/*.sh \
                     scripts/x86_64/*.sh \
                     tests/boot/*.sh

  test-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats, jq and expect
        run: sudo apt-get install -y bats jq expect

      - name: Run shell script tests
        run: bats tests/shell/*.bats

  test-supervisor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4   # same as the image (OS_BUN_VERSION)

      # The suite is written for Jest (package.json "test"), not Bun's built-in
      # runner: `bun test` lacks jest.resetModules and differs on mock hoisting.
      - name: Run supervisor tests (Jest, with coverage gate)
        working-directory: supervisor
        run: |
          bun install --frozen-lockfile
          bun run test:coverage
