name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck packages/os-security/src/os-security \
                     packages/os-security/src/lib/*.sh \
                     packages/os-config/src/os-config \
                     scripts/common/*.sh \
                     scripts/rpi5/*.sh \
                     scripts/x86_64/*.sh

  test-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats and jq
        run: sudo apt-get install -y bats jq

      - name: Run shell script tests
        run: bats tests/shell/*.bats

  test-supervisor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Run supervisor tests
        working-directory: supervisor
        run: |
          bun install
          bun test
