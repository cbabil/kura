name: Images

# Builds the Kura images (Pi 5 SD card image and x86_64 ISO) and boots the ISO
# headless without internet to check first boot, Tomo and device identity.
# Builds use .env.example's default credentials (OS_USER_PASSWD, OS_ROOT_PASSWD).
# On dev pushes the images are 7-day test artifacts; release.yml calls this
# workflow on v* tags, then signs and publishes the images it built.

on:
  workflow_call:
    inputs:
      version:
        description: Version to build (a v* tag or x.y.z); default from .env.example
        type: string
        required: false
  push:
    branches: [dev]
    paths:
      - build.sh
      - config/**
      - scripts/**
      - packages/**
      - overlay/**
      - supervisor/src/**
      - supervisor/package.json
      - supervisor/bun.lock
      - supervisor/os-supervisor.service
      - .env.example
      - tests/boot/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iso
            release_dir: iso
          - target: rpi5
            release_dir: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          df -h /

      # ./build.sh setup would also install docker.io/containerd, which conflict
      # with the runner's Docker; the iso and rpi5 builds don't use host Docker.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap debian-archive-keyring arch-test \
            qemu-user-static binfmt-support debootstrap rsync \
            xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            squashfs-tools e2fsprogs gdisk curl gnupg skopeo zstd unzip
          sudo modprobe loop || true

      - name: Check arm64 emulation
        if: matrix.target == 'rpi5'
        run: test -e /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Configure build
        run: |
          cp .env.example .env
          echo "OS_TMP=\"${RUNNER_TEMP}/kura\"" >> .env
          if [ -n "${VERSION}" ]; then
            echo "OS_VERSION=\"${VERSION#v}\"" >> .env   # tag v0.1.0 -> 0.1.0
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Cache downloads (Tomo release, container images)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kura/cache
          key: downloads-${{ matrix.target }}-${{ hashFiles('scripts/common/fetch-tomo.sh') }}

      # Verifies the pinned Tomo release's Sigstore bundle during the build
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build ${{ matrix.target }}
        run: sudo -E env "PATH=${PATH}" ./build.sh build ${{ matrix.target }}

      # The raw Pi image is mostly empty space: for a release, ship it as .img.zst
      - name: Compress Pi image for release
        if: inputs.version && matrix.target == 'rpi5'
        run: zstd -T0 -15 --rm release/*/arm64/*.img

      # The images only, in one flat directory: upload-artifact would otherwise
      # keep <version>/<dir>/, and release.yml writes its own checksums.
      - name: Stage artifact
        run: |
          mkdir artifact
          find release/*/${{ matrix.release_dir }} -maxdepth 1 -type f \
            \( -name '*.img' -o -name '*.img.zst' -o -name '*.iso' \) -exec ln -t artifact {} +

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: kura-${{ matrix.target }}-${{ github.sha }}
          path: artifact/*
          retention-days: 7
          if-no-files-found: error
          # release assets are already compressed; zipping them again only costs time
          compression-level: ${{ inputs.version && '0' || '6' }}

      # ---- ISO boot test (x86 only; the Pi image needs Pi hardware) ----

      - name: Enable KVM
        if: matrix.target == 'iso'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm: booting with software emulation (slower)"
          fi

      - name: Install boot test tools
        if: matrix.target == 'iso'
        run: sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 sshpass

      - name: Boot test A
        if: matrix.target == 'iso'
        run: tests/boot/iso-boot-test.sh "$(ls release/*/iso/*.iso)" boot-a

      - name: Boot test B (same image, second device)
        if: matrix.target == 'iso'
        run: tests/boot/iso-boot-test.sh "$(ls release/*/iso/*.iso)" boot-b

      - name: Each boot has its own identity
        if: matrix.target == 'iso'
        run: tests/boot/compare-identity.sh boot-a/identity.txt boot-b/identity.txt

      - name: Upload boot logs
        if: always() && matrix.target == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: kura-iso-boot-logs-${{ github.sha }}
          path: |
            boot-a/
            boot-b/
          retention-days: 7
          if-no-files-found: ignore
