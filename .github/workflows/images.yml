name: Images

# Builds the Kura images (Pi 5 SD card image and x86_64 ISO) and boots the ISO
# headless without internet to check first boot, Tomo and device identity.
# Artifacts are test builds with .env.example's default credentials: not for
# distribution.
#
# On a v* tag it also publishes a GitHub Release: images, SHA512SUMS and
# manifest.json, each signed keylessly with Sigstore (cosign) under this
# workflow's identity (ADR-012). Verify with scripts/release/verify-release.sh.

on:
  push:
    branches: [dev]
    tags: ['v*']
    paths:
      - build.sh
      - config/**
      - scripts/**
      - packages/**
      - overlay/**
      - supervisor/src/**
      - supervisor/package.json
      - supervisor/bun.lock
      - supervisor/os-supervisor.service
      - .env.example
      - tests/boot/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iso
            release_dir: iso
          - target: rpi5
            release_dir: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          df -h /

      # ./build.sh setup would also install docker.io/containerd, which conflict
      # with the runner's Docker; the iso and rpi5 builds don't use host Docker.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap debian-archive-keyring arch-test \
            qemu-user-static binfmt-support debootstrap rsync \
            xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            squashfs-tools e2fsprogs gdisk curl gnupg skopeo zstd unzip
          sudo modprobe loop || true

      - name: Check arm64 emulation
        if: matrix.target == 'rpi5'
        run: test -e /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Configure build
        run: |
          cp .env.example .env
          echo "OS_TMP=\"${RUNNER_TEMP}/kura\"" >> .env
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "OS_VERSION=\"${GITHUB_REF_NAME#v}\"" >> .env
          fi

      # Verifies the pinned Tomo release's Sigstore bundle during the build.
      # The build runs under sudo, which resets PATH, so link it into /usr/local/bin.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Make cosign available to the build
        run: sudo ln -sf "$(command -v cosign)" /usr/local/bin/cosign

      - name: Cache downloads (Tomo release, container images)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kura/cache
          key: downloads-${{ matrix.target }}-${{ hashFiles('scripts/common/fetch-tomo.sh') }}

      - name: Build ${{ matrix.target }}
        run: sudo -E ./build.sh build ${{ matrix.target }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: kura-${{ matrix.target }}-${{ github.sha }}
          path: release/*/${{ matrix.release_dir }}/*
          retention-days: 7
          if-no-files-found: error

      # ---- ISO boot test (x86 only; the Pi image needs Pi hardware) ----

      - name: Enable KVM
        if: matrix.target == 'iso'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm: booting with software emulation (slower)"
          fi

      - name: Install boot test tools
        if: matrix.target == 'iso'
        run: sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 sshpass

      - name: Boot test A
        if: matrix.target == 'iso'
        run: tests/boot/iso-boot-test.sh "$(ls release/*/iso/*.iso)" boot-a

      - name: Boot test B (same image, second device)
        if: matrix.target == 'iso'
        run: tests/boot/iso-boot-test.sh "$(ls release/*/iso/*.iso)" boot-b

      - name: Each boot has its own identity
        if: matrix.target == 'iso'
        run: tests/boot/compare-identity.sh boot-a/identity.txt boot-b/identity.txt

      - name: Upload boot logs
        if: always() && matrix.target == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: kura-iso-boot-logs-${{ github.sha }}
          path: |
            boot-a/
            boot-b/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # keyless signing: this job's identity signs the assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Pi image
        uses: actions/download-artifact@v4
        with:
          name: kura-rpi5-${{ github.sha }}
          path: dist
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: kura-iso-${{ github.sha }}
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Prepare assets
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          zstd -T0 -19 --rm ./*.img          # the raw Pi image is mostly empty space
          rm -f SHA512SUMS && sha512sum ./*.img.zst ./*.iso > SHA512SUMS
          version="${TAG#v}"
          bundle() {  # <arch-key> <file>
            jq -n --arg url "https://github.com/${REPO}/releases/download/${TAG}/$2" \
                  --arg sha "$(sha256sum "$2" | cut -d' ' -f1)" \
                  --argjson size "$(stat -c %s "$2")" \
                  '{url: $url, sha256: $sha, size: $size}'
          }
          jq -n --arg version "${version}" \
                --arg released "$(date -u +%Y-%m-%d)" \
                --argjson rpi "$(bundle rpi5-arm64 "$(basename ./*.img.zst)")" \
                --argjson x86 "$(bundle x86_64 "$(basename ./*.iso)")" \
                '{version: $version, channel: "stable", released: $released,
                  bundles: {"rpi5-arm64": $rpi, "x86_64": $x86}}' > manifest.json
          cat manifest.json

      - name: Sign assets (Sigstore, keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          for f in ./*.img.zst ./*.iso SHA512SUMS manifest.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done

      - name: Verify our own signatures
        env:
          KURA_RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in dist/*.img.zst dist/*.iso dist/SHA512SUMS dist/manifest.json; do
            scripts/release/verify-release.sh "${f}" "${TAG}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/*.img.zst dist/*.iso \
            dist/SHA512SUMS dist/manifest.json dist/*.sigstore.json \
            --title "Kura ${TAG}" --generate-notes
