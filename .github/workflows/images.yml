name: Images

# Builds the Kura images (Pi 5 SD card image, x86_64 PC disk image and the PC
# installer), with Kura Desktop's server and helper built first
# (desktop-dist.yml), and boots the PC image headless under UEFI without
# internet: once with a kura-setup.json (as Etchwise writes it), once without,
# checking first boot, the setup, SSH, Docker, device identity and the
# desktop (HTTPS, certificate, sign-in, screenshots). The PC installer then
# installs that image on a blank virtual drive, which is booted and checked.
# Builds use .env.example's default credentials (OS_USER_PASSWD, OS_ROOT_PASSWD);
# first boot replaces the default password with a one-time password.
# Artifacts count against the Actions storage quota, so they live one day and
# dev pushes upload none. release.yml calls this workflow on v* tags and
# publishes both images in the same run.

on:
  workflow_call:
    inputs:
      version:
        description: Version to build (a v* tag or x.y.z); default from .env.example
        type: string
        required: false
  push:
    branches: [dev]
    paths:
      - build.sh
      - config/**
      - scripts/**
      - packages/**
      - overlay/**
      - .env.example
      - tests/boot/**
      # what Kura Desktop's binaries are built from, not its tests or docs
      - desktop/Cargo.*
      - desktop/Makefile
      - desktop/crates/*/src/**
      - desktop/crates/*/Cargo.toml
      - desktop/web/src/**
      - desktop/web/index.html
      - desktop/web/public/**
      - desktop/web/package.json
      - desktop/web/bun.lock
      - .github/workflows/images.yml
      - .github/workflows/desktop-dist.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Kura Desktop's binaries for both architectures (ADR-023, ADR-024)
  desktop:
    uses: ./.github/workflows/desktop-dist.yml

  build:
    name: build ${{ matrix.target }}
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # The PC job also builds the installer, whose test needs the PC image
          - target: pc
            builds: pc pc-installer
            release_glob: "{pc,pc-installer}"
            desktop_arch: x86_64
          - target: rpi5
            builds: rpi5
            release_glob: arm64
            desktop_arch: aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          df -h /

      # ./build.sh setup would also install docker.io/containerd, which conflict
      # with the runner's Docker; the pc and rpi5 builds don't use host Docker.
      - name: Install build tools
        run: |
          # The runners' Ubuntu mirror (azure.archive.ubuntu.com) stopped
          # resolving for hours on 2026-11-11; the main archive serves the same
          # packages, and apt retries a dropped download
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 \
            mmdebstrap debian-archive-keyring arch-test \
            qemu-user-static binfmt-support debootstrap rsync \
            dosfstools e2fsprogs gdisk curl gnupg zstd
          sudo modprobe loop || true

      - name: Check arm64 emulation
        if: matrix.target == 'rpi5'
        run: test -e /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Configure build
        run: |
          cp .env.example .env
          echo "OS_TMP=\"${RUNNER_TEMP}/kura\"" >> .env
          # Kura Desktop's binaries from desktop-dist.yml; build.sh fails if they are missing
          echo "OS_DESKTOP_DIST=\"${GITHUB_WORKSPACE}/desktop-dist\"" >> .env
          # The shared Browser's packages (ADR-036), PC image only, so the
          # boot test opens a real Chromium in Kura Desktop
          echo 'OS_BROWSER="true"' >> .env
          if [ -n "${VERSION}" ]; then
            echo "OS_VERSION=\"${VERSION#v}\"" >> .env   # tag v0.1.0 -> 0.1.0
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Get Kura Desktop for ${{ matrix.desktop_arch }}
        uses: actions/download-artifact@v4
        with:
          name: desktop-dist-${{ matrix.desktop_arch }}
          path: desktop-dist/${{ matrix.desktop_arch }}

      # The build runs as root; the steps below (zstd, staging) run as the runner
      - name: Build ${{ matrix.target }}
        run: |
          for target in ${{ matrix.builds }}; do
            sudo -E env "PATH=${PATH}" ./build.sh build "${target}"
          done
          sudo chown -R "$(id -u):$(id -g)" release

      # ---- PC boot test (UEFI in QEMU; the Pi image needs Pi hardware) ----

      - name: Enable KVM
        if: matrix.target == 'pc'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm: booting with software emulation (slower)"
          fi

      - name: Install boot test tools
        if: matrix.target == 'pc'
        run: sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf mtools sshpass expect

      # A real browser for the desktop's screenshots (tests/boot/desktop-checks.sh)
      - name: Install bun
        if: matrix.target == 'pc'
        uses: oven-sh/setup-bun@v2

      - name: Cache Playwright's Chromium
        if: matrix.target == 'pc'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('desktop/web/bun.lock') }}

      - name: Install Playwright's Chromium
        if: matrix.target == 'pc'
        working-directory: desktop/web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      # Three devices from the same image, booted side by side: A with a setup
      # file from the imager, B without, C with the full custom disk layout
      - name: Boot tests A (setup file), B (no setup file), C (full layout)
        if: matrix.target == 'pc'
        env:
          KURA_TEST_SCREENSHOTS: "1"
        run: |
          img=$(ls release/*/pc/*.img)
          tests/boot/boot-test.sh "${img}" boot-a 2222 --setup > boot-a.log 2>&1 & a=$!
          tests/boot/boot-test.sh "${img}" boot-b 2223 > boot-b.log 2>&1 & b=$!
          # C also turns the desktop off in its setup file
          KURA_TEST_LAYOUT=full KURA_TEST_DESKTOP=false \
            tests/boot/boot-test.sh "${img}" boot-c 2224 --setup > boot-c.log 2>&1 & c=$!
          status=0
          wait "${a}" || status=1
          wait "${b}" || status=1
          wait "${c}" || status=1
          echo "== Boot A (setup file)"; cat boot-a.log
          echo "== Boot B (no setup file)"; cat boot-b.log
          echo "== Boot C (full layout)"; cat boot-c.log
          exit "${status}"

      # The installer, from a USB key with a setup file, onto a blank drive
      - name: Install test
        if: matrix.target == 'pc'
        run: |
          tests/boot/installer-test.sh release/*/pc-installer/*.img release/*/pc/*.img install

      # The latest released Kura, upgraded in place to the package just built
      # (ADR-025): the path an owner's device takes
      - name: Upgrade test
        if: matrix.target == 'pc'
        run: |
          command -v dpkg-scanpackages >/dev/null || sudo apt-get install -y -qq dpkg-dev
          tests/boot/upgrade-test.sh release/*/pc/kura_*_amd64.deb upgrade

      # Raw images are mostly empty space: releases ship them as .img.zst. Dev
      # runs only have to build and boot, so nothing is compressed or uploaded.
      - name: Compress image
        if: inputs.version
        run: zstd -T0 -15 --rm release/*/${{ matrix.release_glob }}/*.img

      # The images only, in one flat directory: upload-artifact would otherwise
      # keep <version>/<dir>/, and release.yml writes its own checksums.
      - name: Stage artifact
        if: inputs.version
        run: |
          mkdir artifact
          find release/*/${{ matrix.release_glob }} -maxdepth 1 -type f \
            \( -name '*.img.zst' -o -name '*.deb' \) -exec ln -t artifact {} +

      # The images are only needed by release.yml
      - name: Upload image
        if: inputs.version
        uses: actions/upload-artifact@v4
        with:
          name: kura-${{ matrix.target }}-${{ github.sha }}
          path: artifact/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0   # the images are already compressed

      - name: Each boot has its own identity
        if: matrix.target == 'pc'
        run: tests/boot/compare-identity.sh boot-a/identity.txt boot-b/identity.txt

      - name: Upload boot logs
        if: always() && matrix.target == 'pc'
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs-${{ github.sha }}   # not kura-*: release.yml downloads those
          path: |
            boot-a/
            boot-b/
            boot-c/
            install/
            upgrade/
            !upgrade/*.img*
            !upgrade/id_ed25519*
            !upgrade/monitor.sock
            !upgrade/repo/
            !boot-*/disk.img
            !boot-*/id_ed25519*
            !boot-*/monitor.sock
            !install/monitor.sock
            !install/installed/monitor.sock
            !install/*.img
            !install/serve/
            !install/installed/disk.img
            !install/installed/id_ed25519*
          retention-days: 1
          if-no-files-found: ignore
