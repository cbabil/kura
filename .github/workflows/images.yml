name: Images

# Builds the Kura images (Pi 5 SD card image and x86_64 PC disk image) and boots
# the PC image headless under UEFI without internet: once with a kura-setup.json
# (as Etchwise writes it), once without, checking first boot, the setup, SSH,
# Docker and device identity.
# Builds use .env.example's default credentials (OS_USER_PASSWD, OS_ROOT_PASSWD).
# Artifacts count against the Actions storage quota, so they live one day and
# dev pushes keep only the PC image. release.yml calls this workflow on v* tags and
# publishes both images in the same run.

on:
  workflow_call:
    inputs:
      version:
        description: Version to build (a v* tag or x.y.z); default from .env.example
        type: string
        required: false
  push:
    branches: [dev]
    paths:
      - build.sh
      - config/**
      - scripts/**
      - packages/**
      - overlay/**
      - .env.example
      - tests/boot/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pc
            release_dir: pc
          - target: rpi5
            release_dir: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          df -h /

      # ./build.sh setup would also install docker.io/containerd, which conflict
      # with the runner's Docker; the pc and rpi5 builds don't use host Docker.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap debian-archive-keyring arch-test \
            qemu-user-static binfmt-support debootstrap rsync \
            dosfstools e2fsprogs gdisk curl gnupg zstd
          sudo modprobe loop || true

      - name: Check arm64 emulation
        if: matrix.target == 'rpi5'
        run: test -e /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Configure build
        run: |
          cp .env.example .env
          echo "OS_TMP=\"${RUNNER_TEMP}/kura\"" >> .env
          if [ -n "${VERSION}" ]; then
            echo "OS_VERSION=\"${VERSION#v}\"" >> .env   # tag v0.1.0 -> 0.1.0
          fi
        env:
          VERSION: ${{ inputs.version }}

      # The build runs as root; the steps below (zstd, staging) run as the runner
      - name: Build ${{ matrix.target }}
        run: |
          sudo -E env "PATH=${PATH}" ./build.sh build ${{ matrix.target }}
          sudo chown -R "$(id -u):$(id -g)" release

      # Raw images are mostly empty space: ship them as .img.zst (the PC image
      # always, since dev runs upload it for the boot test's logs and reuse)
      - name: Compress image
        if: inputs.version || matrix.target == 'pc'
        run: zstd -T0 -15 --rm release/*/${{ matrix.release_dir }}/*.img

      # The images only, in one flat directory: upload-artifact would otherwise
      # keep <version>/<dir>/, and release.yml writes its own checksums.
      - name: Stage artifact
        if: inputs.version || matrix.target == 'pc'
        run: |
          mkdir artifact
          find release/*/${{ matrix.release_dir }} -maxdepth 1 -type f \
            -name '*.img.zst' -exec ln -t artifact {} +

      # The Pi image is only needed by release.yml: a dev build just has to succeed
      - name: Upload image
        if: inputs.version || matrix.target == 'pc'
        uses: actions/upload-artifact@v4
        with:
          name: kura-${{ matrix.target }}-${{ github.sha }}
          path: artifact/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0   # the images are already compressed

      # ---- PC boot test (UEFI in QEMU; the Pi image needs Pi hardware) ----

      - name: Enable KVM
        if: matrix.target == 'pc'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm: booting with software emulation (slower)"
          fi

      - name: Install boot test tools
        if: matrix.target == 'pc'
        run: sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf mtools sshpass expect

      - name: Boot test A (setup file from the imager)
        if: matrix.target == 'pc'
        run: tests/boot/boot-test.sh "$(ls release/*/pc/*.img.zst)" boot-a 2222 --setup

      - name: Boot test B (no setup file, second device)
        if: matrix.target == 'pc'
        run: tests/boot/boot-test.sh "$(ls release/*/pc/*.img.zst)" boot-b 2222

      - name: Each boot has its own identity
        if: matrix.target == 'pc'
        run: tests/boot/compare-identity.sh boot-a/identity.txt boot-b/identity.txt

      - name: Upload boot logs
        if: always() && matrix.target == 'pc'
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs-${{ github.sha }}   # not kura-*: release.yml downloads those
          path: |
            boot-a/
            boot-b/
            !boot-*/disk.img
            !boot-*/id_ed25519*
          retention-days: 1
          if-no-files-found: ignore
